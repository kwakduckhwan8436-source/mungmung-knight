<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#8d5a2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>멍멍기사 디펜스</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#2a1a10;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;touch-action:none;image-rendering:auto}
  #rotate{display:none;position:fixed;inset:0;background:#8d5a2b;color:#ffe082;z-index:9;
    flex-direction:column;align-items:center;justify-content:center;font:bold 22px sans-serif;text-align:center;gap:18px}
  #rotate .ph{width:70px;height:110px;border:6px solid #ffe082;border-radius:14px;animation:rot 1.6s ease-in-out infinite}
  @keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
  @media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rotate"><div class="ph"></div>휴대폰을 가로로 돌려 주세요<br><small style="font-size:15px;color:#fff">멍멍기사 디펜스는 가로 화면 게임이에요</small></div>
<div id="err" style="display:none;position:fixed;inset:0;z-index:20;background:rgba(40,20,8,.94);color:#ffe9b0;font:16px sans-serif;padding:24px;box-sizing:border-box;overflow:auto">
  <b style="font-size:22px">멍멍기사가 넘어졌어요! (실행 오류)</b><p>아래 버튼을 누르면 저장된 옛 파일을 지우고 새로 불러옵니다. 계속되면 이 화면을 캡처해서 보내 주세요.</p>
  <button id="errbtn" style="font:bold 18px sans-serif;padding:12px 22px;border-radius:12px;border:0;background:#ffc93c;color:#4a2a14">새로 고침</button>
  <pre id="errmsg" style="white-space:pre-wrap;font-size:12px;color:#ffd0c0;margin-top:16px"></pre>
</div>
<script>
  // 실행 오류를 화면에 보여주는 안전장치 (흰/검은 화면으로 멈추지 않도록)
  window.MMK_BUILD = '1.0.0';
  window.mmkFail = function (msg) {
    var e = document.getElementById('err'); if (!e) return;
    e.style.display = 'block'; document.getElementById('errmsg').textContent += msg + '\n';
  };
  window.addEventListener('error', function (ev) { mmkFail((ev.message || '오류') + ' @ ' + (ev.filename || '').split('/').pop() + ':' + (ev.lineno || '')); });
  document.getElementById('errbtn').onclick = function () {
    try { if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }); } catch (e) {}
    try { navigator.serviceWorker && navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }); } catch (e) {}
    setTimeout(function () { location.reload(); }, 300);
  };
</script>
<script src="js/audio.js?v=1.6.0"></script>
<script src="js/art.js?v=1.6.0"></script>
<script src="js/story.js?v=1.6.0"></script>
<script src="js/story2.js?v=1.6.0"></script>
<script src="js/story3.js?v=1.6.0"></script>
<script src="js/lore.js?v=1.6.0"></script>
<script src="js/story4.js?v=1.6.0"></script>
<script src="js/story5.js?v=1.6.0"></script>
<script src="js/story6.js?v=1.6.0"></script>
<script src="js/story7.js?v=1.6.0"></script>
<script src="js/story8.js?v=1.6.0"></script>
<script src="js/story9.js?v=1.6.0"></script>
<script src="js/story10.js?v=1.6.0"></script>
<script src="js/story11.js?v=1.6.0"></script>
<script src="js/story_plus.js?v=1.6.0"></script>
<script src="js/lore2.js?v=1.6.0"></script>
<script src="art/artpack.js?v=1.6.0"></script>
<script src="js/game.js?v=1.6.0"></script>
<script>
  // PWA 오프라인 캐시 (https 또는 localhost 에서만 동작, 실패해도 게임은 정상)
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    try { window.top === window.self && navigator.serviceWorker.register('sw.js').catch(function(){}); } catch (e) {}
  }
</script>
</body>
</html>
