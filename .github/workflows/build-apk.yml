name: APK 만들기
on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 프로젝트 폴더 찾기
        run: |
          F=$(find . -name capacitor.config.json -not -path "*/node_modules/*" | head -1)
          if [ -z "$F" ]; then echo "capacitor.config.json 을 찾지 못했어요. 앱빌드용 ZIP 안의 파일을 올렸는지 확인하세요."; exit 1; fi
          echo "APP=$(dirname "$F")" >> $GITHUB_ENV
          echo "프로젝트 폴더: $(dirname "$F")"
      - name: 패키지 설치 + 안드로이드 프로젝트 만들기
        run: |
          cd "$APP"
          npm install
          rm -rf android
          npx cap add android
          node tools/patch_android.js
          node tools/apk_icons.js
          npx cap sync android
      - name: APK 빌드
        run: |
          cd "$APP"
          mkdir -p ~/.android && cp tools/keystore/debug.keystore ~/.android/debug.keystore
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: 파일 이름 정리
        run: |
          cd "$APP"
          V=$(node -p "require('./package.json').version")
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/mungmung-knight-v$V.apk"
          ls -la "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@v4
        with:
          name: mungmung-knight-apk
          path: out/*.apk
          retention-days: 30
